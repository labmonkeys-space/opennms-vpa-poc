# Arm A: VPA resizes CPU in place only. Memory is applied from the VPA
# recommendation with a Helm upgrade, so VPA never restarts a JVM.
vpa:
  components:
    core: {controlledResources: [cpu]}
    minion: {controlledResources: [cpu]}
    kafka: {controlledResources: [cpu]}
