# Arm A: VPA resizes CPU in place only. Memory stays static.
# A CPU-only VPA computes no memory recommendation.
vpa:
  components:
    core: {controlledResources: [cpu]}
    minion: {controlledResources: [cpu]}
    kafka: {controlledResources: [cpu]}
