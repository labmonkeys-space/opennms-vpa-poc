suite: vpa
templates:
  - templates/vpa.yaml
release:
  name: poc
  namespace: poc
tests:
  - it: renders one VPA per component
    asserts:
      - hasDocuments: {count: 4}
      - isKind: {of: "VerticalPodAutoscaler"}
  - it: resizes Core in place, on a single replica, with limits scaled
    documentSelector: {path: "metadata.name", value: "core"}
    asserts:
      - equal:
          path: "spec.targetRef"
          value:
            apiVersion: "apps/v1"
            kind: "StatefulSet"
            name: "core"
      - equal: {path: "spec.updatePolicy.updateMode", value: "InPlaceOrRecreate"}
      - equal: {path: "spec.updatePolicy.minReplicas", value: 1}
      - equal: {path: "spec.resourcePolicy.containerPolicies[0].containerName", value: "core"}
      - equal: {path: "spec.resourcePolicy.containerPolicies[0].controlledValues", value: "RequestsAndLimits"}
      - equal:
          path: "spec.resourcePolicy.containerPolicies[1]"
          value:
            containerName: "*"
            mode: "Off"
  - it: only recommends for PostgreSQL
    documentSelector: {path: "metadata.name", value: "postgresql"}
    asserts:
      - equal: {path: "spec.updatePolicy.updateMode", value: "Off"}
  - it: renders nothing when disabled
    set:
      vpa.enabled: false
    asserts:
      - hasDocuments: {count: 0}
  - it: rejects an unknown updateMode
    set:
      vpa.components.core.updateMode: Auto
    asserts:
      - failedTemplate:
          errorPattern: 'vpa.components.core.updateMode "Auto" is not one of Off, Initial, Recreate, InPlaceOrRecreate'
  - it: defaults controlledResources to cpu and memory
    documentSelector: {path: metadata.name, value: core}
    asserts:
      - equal:
          path: spec.resourcePolicy.containerPolicies[0].controlledResources
          value: [cpu, memory]
  - it: lets an arm restrict a component to cpu
    documentSelector: {path: metadata.name, value: minion}
    set:
      vpa.components.minion.controlledResources: [cpu]
    asserts:
      - equal:
          path: spec.resourcePolicy.containerPolicies[0].controlledResources
          value: [cpu]
  - it: pins the campaign maxAllowed bounds (uncapped Phase 3 peak x 1.5)
    asserts:
      - equal:
          path: spec.resourcePolicy.containerPolicies[0].maxAllowed
          value: {cpu: "8", memory: 6144Mi}
        documentSelector: {path: metadata.name, value: core}
      - equal:
          path: spec.resourcePolicy.containerPolicies[0].maxAllowed
          value: {cpu: "1", memory: 2304Mi}
        documentSelector: {path: metadata.name, value: minion}
      - equal:
          path: spec.resourcePolicy.containerPolicies[0].maxAllowed
          value: {cpu: 500m, memory: 1280Mi}
        documentSelector: {path: metadata.name, value: kafka}
      - equal:
          path: spec.resourcePolicy.containerPolicies[0].maxAllowed
          value: {cpu: "6", memory: 1024Mi}
        documentSelector: {path: metadata.name, value: postgresql}
