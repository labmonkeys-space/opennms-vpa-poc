# One release per namespace. Object names are fixed (postgresql, kafka, core,
# minion) so the subcharts can address each other without templating.

core:
  fullnameOverride: core
  postgresql:
    host: postgresql
  kafka:
    bootstrapServers: kafka:9092
  persistence:
    size: 5Gi
  # Nothing polls, so the ICMP sysctl is not needed.
  icmp:
    enabled: false
  # Admin password bootstrap pulls an extra image. Not needed for the PoC.
  webAdmin:
    enabled: false
  # Only Eventd, Alarmd, Trapd, EventTranslator, Provisiond, Vacuumd and the
  # Jetty/Karaf services are needed to hold nodes and turn traps into alarms.
  # Vacuumd stays on: it runs the key-value TTL reaper and DB maintenance.
  daemons:
    ackd: {enabled: false}
    actiond: {enabled: false}
    bsmd: {enabled: false}
    collectd: {enabled: false}
    discovery: {enabled: false}
    enhancedlinkd: {enabled: false}
    # EventTranslator stays on. The stock linkDown event
    # uei.opennms.org/generic/traps/SNMP_Link_Down is logmsg dest="donotpersist"
    # (Eventd debug log: "marked as 'donotpersist'; not processing event"), so a
    # linkDown trap never becomes an event or alarm. Only the translator rewrites it to
    # uei.opennms.org/translator/traps/SNMP_Link_Down, which carries the alarm-data.
    eventtranslator: {enabled: true}
    notifd: {enabled: false}
    passivestatusd: {enabled: false}
    perspectivepoller: {enabled: false}
    pollerd: {enabled: false}
    queued: {enabled: false}
    rtcd: {enabled: false}
    scriptd: {enabled: false}
    statsd: {enabled: false}
    telemetryd: {enabled: false}
    ticketer: {enabled: false}
  # Replaces the image default -Xmx1024m.
  #   UseG1GC:                ergonomics picks SerialGC below 2 CPUs or ~1792 MiB.
  #   MaxRAMPercentage=70:    heap follows the container limit after a restart.
  #                           Phase 1: runs/phase1-memory/20260930T210800Z-core-1792Mi non-heap 530 MiB,
  #                           floor((2304 - 530 x 1.2) / 2304 x 100) = 72, capped at 70.
  #   InitialRAMPercentage=25: resident memory starts low so VPA sees real demand.
  #   MaxMetaspaceSize, ReservedCodeCacheSize: bound non-heap so the percentage holds.
  #   G1PeriodicGCInterval:   returns unused heap to the OS.
  #   ActiveProcessorCount=4: without a CPU limit the JVM sizes pools to the node's
  #                           cores; pin to the VPA maxAllowed CPU instead.
  javaOpts: "-XX:+UseG1GC -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=25 -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=240m -XX:G1PeriodicGCInterval=60000 -XX:ActiveProcessorCount=4"
  # Phase 1: runs/phase1-memory/20260930T210800Z-core-1792Mi floor 1792Mi x 1.25 -> 2304Mi
  # Phase 1: runs/phase1-cpu/20261001T041447Z-core-1 floor 1 CPU
  # Requests equal minAllowed, memory limit equals the request, no CPU limit.
  resources:
    requests: {cpu: "1", memory: 2304Mi}
    limits: {memory: 2304Mi}
  resizePolicy:
    - {resourceName: cpu, restartPolicy: NotRequired}
    - {resourceName: memory, restartPolicy: RestartContainer}

minion:
  fullnameOverride: minion
  location: poc
  kafka:
    bootstrapServers: kafka:9092
  persistence:
    size: 1Gi
  icmp:
    enabled: false
  # The image forces -Xmx; derive it from the memory limit at every start.
  heapFromCgroup:
    enabled: true
    # Phase 1: runs/phase1-memory/20260930T215554Z-minion-768Mi non-heap 269 MiB,
    # floor((1024 - 269 x 1.2) / 1024 x 100) = 68.
    maxPercent: 68
    minPercent: 25
  #   UseG1GC, G1PeriodicGCInterval: as for Core.
  #   ActiveProcessorCount=2: sizes trapd.threads (default cores*2) and GC threads
  #                           to the VPA maxAllowed CPU, not the node.
  javaOpts: "-XX:+UseG1GC -XX:G1PeriodicGCInterval=60000 -XX:ActiveProcessorCount=2"
  # Phase 1: runs/phase1-memory/20260930T215554Z-minion-768Mi floor 768Mi x 1.25 -> 1024Mi
  # Phase 1: runs/phase1-cpu/20261001T060837Z-minion-100m lowest tested 100m
  resources:
    requests: {cpu: 100m, memory: 1024Mi}
    limits: {memory: 1024Mi}
  resizePolicy:
    - {resourceName: cpu, restartPolicy: NotRequired}
    - {resourceName: memory, restartPolicy: RestartContainer}

postgresql:
  image: postgres:18
  storage: 5Gi
  storageClassName: ""
  # PostgreSQL does not follow a resized pod on its own: shared_buffers is fixed
  # at start. Its VPA runs in Off mode and these values are changed by a Helm
  # upgrade after reading the recommendation.
  sharedBuffers: 128MB
  # Every backend costs memory. Must cover Core's JDBC pool (default 50) plus
  # the installer and admin sessions.
  maxConnections: 100
  # Phase 1: runs/phase1-memory/20261001T015250Z-postgresql-128Mi lowest tested 128Mi x 1.25 -> 256Mi
  # Phase 1: runs/phase1-cpu/20261001T074545Z-postgresql-100m lowest tested 100m
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 256Mi}

kafka:
  image: apache/kafka:3.9.1
  # 22-character base64 cluster id used to format storage on first start.
  clusterId: MkU3OEVBNTcwNTJENDM2Qk
  storage: 5Gi
  storageClassName: ""
  # Traps and RPC messages are consumed within seconds. One hour keeps disk small.
  retentionMs: 3600000
  # Applies to every auto-created topic, including OpenNMS.Sink.Trap. Core's
  # trap consumer parallelism is capped by this number, and VPA cannot change it.
  numPartitions: 1
  # Kafka lives on the page cache, so its heap stays small.
  #   UseG1GC:              ergonomics picks SerialGC below 2 CPUs or ~1792 MiB.
  #   MaxRAMPercentage:     heap follows the container limit after a restart.
  #   InitialRAMPercentage: resident memory starts low so VPA sees real demand.
  #   G1PeriodicGCInterval: returns unused heap to the OS.
  #   ActiveProcessorCount=2: pins JVM thread pools and GC threads to the VPA maxAllowed CPU "2".
  heapOpts: "-XX:+UseG1GC -XX:MaxRAMPercentage=40 -XX:InitialRAMPercentage=10 -XX:G1PeriodicGCInterval=60000 -XX:ActiveProcessorCount=2"
  # Phase 1: runs/phase1-memory/20261001T022905Z-kafka-512Mi floor 512Mi x 1.25 -> 768Mi
  # Phase 1: runs/phase1-cpu/20261001T071124Z-kafka-100m lowest tested 100m
  resources:
    requests: {cpu: 100m, memory: 768Mi}
    limits: {memory: 768Mi}
  resizePolicy:
    - {resourceName: cpu, restartPolicy: NotRequired}
    - {resourceName: memory, restartPolicy: RestartContainer}

trapService:
  # NodePort in the lab, LoadBalancer where the cluster provides one.
  type: NodePort
  nodePort: 30162

vpa:
  enabled: true
  # minAllowed and maxAllowed are starting bounds. Phase 1 sets minAllowed to
  # the measured floor; Phase 3 sets maxAllowed from the peak plus headroom.
  # Keep each JVM's ActiveProcessorCount equal to its maxAllowed CPU.
  components:
    # Each component may set controlledResources. Default [cpu, memory] (arm B).
    # campaign/values/arm-a.yaml restricts core, minion and kafka to [cpu]:
    # CPU changes in place, memory follows the recommendation by Helm upgrade.
    postgresql:
      kind: StatefulSet
      name: postgresql
      container: postgresql
      # shared_buffers needs a restart and a config change; apply by Helm upgrade.
      updateMode: "Off"
      # Phase 1: runs/phase1-memory/20261001T015250Z-postgresql-128Mi 128Mi x 1.25 -> 256Mi;
      # runs/phase1-cpu/20261001T074545Z-postgresql-100m 100m.
      minAllowed: {cpu: 100m, memory: 256Mi}
      maxAllowed: {cpu: "2", memory: 4Gi}
    kafka:
      kind: StatefulSet
      name: kafka
      container: kafka
      updateMode: InPlaceOrRecreate
      # Phase 1: runs/phase1-memory/20261001T022905Z-kafka-512Mi 512Mi x 1.25 -> 768Mi;
      # runs/phase1-cpu/20261001T071124Z-kafka-100m 100m.
      minAllowed: {cpu: 100m, memory: 768Mi}
      maxAllowed: {cpu: "2", memory: 4Gi}
    core:
      kind: StatefulSet
      name: core
      container: core
      updateMode: InPlaceOrRecreate
      # Phase 1: runs/phase1-memory/20260930T210800Z-core-1792Mi 1792Mi x 1.25 -> 2304Mi;
      # runs/phase1-cpu/20261001T041447Z-core-1 1 CPU.
      minAllowed: {cpu: "1", memory: 2304Mi}
      maxAllowed: {cpu: "4", memory: 12Gi}
    minion:
      kind: StatefulSet
      name: minion
      container: minion
      updateMode: InPlaceOrRecreate
      # Phase 1: runs/phase1-memory/20260930T215554Z-minion-768Mi 768Mi x 1.25 -> 1024Mi;
      # runs/phase1-cpu/20261001T060837Z-minion-100m 100m.
      minAllowed: {cpu: 100m, memory: 1024Mi}
      maxAllowed: {cpu: "2", memory: 4Gi}
